name: Verificações

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'chore/**', 'docs/**', 'release/**', 'hotfix/**', 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://busca_vagas:local_dev@127.0.0.1:5432/busca_vagas
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: busca_vagas
          POSTGRES_PASSWORD: local_dev
          POSTGRES_DB: busca_vagas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U busca_vagas -d busca_vagas"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e '.[dev]'
      - name: Ruff
        run: python -m ruff check .
      - name: Testes
        run: python -m pytest
      - name: Aplicar migrações em PostgreSQL vazio
        run: python -m alembic upgrade head

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Gerar tipos de rotas do Next.js
        run: npx next typegen
      - name: Verificar TypeScript
        run: npx tsc --noEmit
      - run: npm run build

  compose:
    name: Configuração Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuração com ambiente de exemplo
        run: |
          cp backend/.env.example backend/.env
          docker compose --profile worker config --quiet
